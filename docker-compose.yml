
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env.airflow
  environment:
    CASSANDRA_HOST: cassandra
    CASSANDRA_PORT: 9042
    SPARK_MASTER_URL: local[*]
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./MODEL:/opt/airflow/MODEL
    - ./DATA:/opt/airflow/DATA
    - ./config:/opt/airflow/config
    - ./logs:/opt/airflow/logs_pipeline
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres-airflow:
      condition: service_healthy

services:
  # ============================================================
  # ZOOKEEPER — Koordinator Kafka Cluster
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: crypto_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # KAFKA — Message Broker untuk streaming data OHLCV
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: crypto_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ============================================================
  # CASSANDRA — Database NoSQL untuk penyimpanan data OHLCV
  # ============================================================
  cassandra:
    image: cassandra:4.1
    container_name: crypto_cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=CryptoCluster
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s


  # ============================================================
  # BINANCE INGESTION — Streaming: Binance WS → Kafka (always-on)
  # ============================================================
  binance-ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto_binance_ingestion
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./src:/opt/airflow/src
      - ./logs:/opt/airflow/logs_pipeline
    command: python -m src.ingestion.binance_ws_producer
    restart: always

  # ============================================================
  # HEALTH CHECK SERVICE — Prometheus metrics exporter (port 8000)
  # ============================================================
  health-check:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto_health_check
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      HEALTH_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./src:/opt/airflow/src
      - ./monitoring:/opt/airflow/monitoring
      - ./logs:/opt/airflow/logs_pipeline
    command: python /opt/airflow/monitoring/health_check.py
    restart: always

  # ============================================================
  # PROMETHEUS — Metrics scraper
  # UI: http://localhost:9090
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: crypto_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    restart: always

  # ============================================================
  # GRAFANA — Dashboard monitoring + Alerting
  # UI: http://localhost:3000 | Login: admin / admin
  # ============================================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: crypto_grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ALERTING_ENABLED: "true"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      # Kirim alert via Telegram
      GF_SMTP_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: always

  # ============================================================
  # POSTGRESQL AIRFLOW — Metadata store internal Airflow
  # ============================================================
  postgres-airflow:
    image: postgres:15
    container_name: crypto_postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # AIRFLOW INIT — One-time setup
  # ============================================================
  airflow-init:
    <<: *airflow-common
    container_name: crypto_airflow_init
    entrypoint: /bin/bash
    command: >
      -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"
    restart: "no"

  # ============================================================
  # AIRFLOW WEBSERVER — Web UI Monitoring (port 8080)
  # ============================================================
  airflow-webserver:
    <<: *airflow-common
    container_name: crypto_airflow_webserver
    command: airflow webserver --port 8080
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================
  # AIRFLOW SCHEDULER — Menjalankan DAG sesuai jadwal
  # ============================================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: crypto_airflow_scheduler
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  cassandra_data:
  postgres_airflow_data:
  airflow_logs:
  prometheus_data:
  grafana_data:
