global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'crypto-pipeline'

# ─── Alerting Rules ──────────────────────────────────────────────────────────
# Alert dikirim ke Grafana Alertmanager untuk notifikasi
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['grafana:3000']

# ─── Rule Files ──────────────────────────────────────────────────────────────
rule_files:
  - "alert_rules.yml"

scrape_configs:

  - job_name: "health-check"
    metrics_path: /metrics
    static_configs:
      - targets: ["health-check:8000"]

  - job_name: "kafka-consumer"
    metrics_path: /metrics
    static_configs:
      - targets: ["kafka-consumer:8000"]

  - job_name: "binance-ingestion"
    metrics_path: /metrics
    static_configs:
      - targets: ["binance-ingestion:8000"]

  - job_name: "airflow"
    metrics_path: /metrics
    static_configs:
      - targets: ["statsd-exporter:9102"]

  - job_name: "apache-spark"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080", "host.docker.internal:8081"]
